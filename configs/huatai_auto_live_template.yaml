# Simulation command supports account_snapshot, submit_orders, query_orders, cancel_orders. Keep disabled for real trading until audited.
# Example only. This config is for simulation wiring tests, not real broker submission.
validation:
  apply_active_execution: true

auto_live:
  enabled: false
  emergency_stop: true
  risk_limits:
    enabled: true
    max_orders_per_batch: 50
    max_single_order_amount: 100000
    max_batch_buy_amount: 200000
    max_batch_gross_amount: 400000
    max_daily_buy_amount: 200000
    max_daily_gross_amount: 400000
    min_cash_buffer_ratio: 0.02
    min_cash_buffer_amount: 10000
    allowed_sides: [buy, sell]
  broker_adapter: command
  allow_command_adapter: false
  allow_broker_submit: false
  require_exact_fill_fees: true
  require_adapter_replay_certification: true
  adapter_replay_dir: ""
  journal:
    enabled: true
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
  account_binding:
    required: true
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
  recovery:
    enabled: true
    required_before_submit: true
    retention_points: 30
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    required_files:
      - account_state_snapshot.csv
      - account_state_positions.csv
      - auto_live_broker_account_snapshot.csv
      - auto_live_broker_positions.csv
      - auto_live_broker_account_audit.csv
      - auto_live_account_binding.json
      - auto_live_event_journal.csv
      - auto_live_risk_audit.csv
    critical_files:
      - auto_live_journal_summary.csv
      - auto_live_adapter_replay_summary.csv
      - auto_live_adapter_file_audit.csv
  rollout:
    required_before_submit: true
    stage: canary
    approval_ttl_hours: 24
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    stages:
      canary:
        max_orders: 1
        max_single_order_amount: 20000
        max_buy_amount: 20000
        max_gross_amount: 20000
      limited:
        max_orders: 10
        max_single_order_amount: 50000
        max_buy_amount: 200000
        max_gross_amount: 200000
      full:
        max_orders: 50
        max_single_order_amount: 100000
        max_buy_amount: 200000
        max_gross_amount: 400000
  alerting:
    enabled: true
    required_before_submit: true
    require_live_environment: true
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    selftest_max_age_seconds: 86400
    timeout_seconds: 15
    pinned_files:
      - path: scripts/alert_bridge_template.py
        sha256: c5d252ec40186a26cbe3ce408235ef14dc8cc80c882237e324c1f8c800f2ae8c
    command:
      - .venv/Scripts/python.exe
      - scripts/alert_bridge_template.py
      - --simulate
  service:
    enabled: false
    allow_submit: false
    interval_seconds: 60
    max_cycles: 0
    max_consecutive_failures: 3
    failure_backoff_seconds: 300
    lock_stale_seconds: 300
  allow_simulated_account_snapshot: false
  allow_outside_trading_window: false
  allow_stale_tickets: false
  max_ticket_age_days: 0
  account_snapshot_max_age_seconds: 300
  capital_feasibility:
    min_target_weight_coverage: 0.80
    max_allocation_l1_error: 0.25
    min_invested_ratio: 0.85
  require_broker_clock_sync: true
  max_broker_clock_skew_seconds: 5
  submit_lock_stale_seconds: 900
  trading_window:
    timezone: Asia/Shanghai
    weekdays: [0, 1, 2, 3, 4]
    windows:
      - "09:25-11:30"
      - "13:00-14:57"
  command_adapter:
    require_hmac_integrity: true
    integrity_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    require_pinned_files: true
    require_complete_pin_manifest: true
    required_pinned_paths:
      - scripts/huatai_command_bridge.py
      - ashare_quant/__init__.py
      - ashare_quant/autolive_integrity.py
      - ashare_quant/config.py
      - ashare_quant/io_utils.py
      - ashare_quant/huatai_canary.py
      - ashare_quant/huatai_desktop_live.py
      - ashare_quant/huatai_desktop_rpa.py
      - configs/huatai_bridge_template.yaml
    pinned_files:
      - path: scripts/huatai_command_bridge.py
        sha256: 832f3e51ee2408deb9e9aa497b9224664fa1f270aa3adbb32a506c432b9a6e92
      - path: ashare_quant/__init__.py
        sha256: 0ce5156f37f5be81c4be9fdb845df16a41c50f8452f4d2a1a2223137e6d5677d
      - path: ashare_quant/autolive_integrity.py
        sha256: a42b70bfa0f3d236925c4472497e0487616b9f33fd6808c61d926ec6a9cc4614
      - path: ashare_quant/config.py
        sha256: 749825968adb9030d3bda2ef33805c08463f0255dff192134bfdb6e30174142b
      - path: ashare_quant/io_utils.py
        sha256: da4b9e1bb484e20148a2db58e02e78f2d34723859b44d9baad8dbbea00054483
      - path: ashare_quant/huatai_canary.py
        sha256: bf81524ee7fc52a4cdc3be5d765bb6f0b8f4a04e5b793ea3d9de3237d3c240d1
      - path: ashare_quant/huatai_desktop_live.py
        sha256: 0cbc50d073ce9752e297c0d19bd9c34bee263e22e5f3ad0f0071ea429259b7d5
      - path: ashare_quant/huatai_desktop_rpa.py
        sha256: 538ef357dfd24edcd5607290fe28c71cc70465a2df3dc36e71b167ec269aaedd
      - path: configs/huatai_bridge_template.yaml
        sha256: 5d1894f953e26f6fa5e175612d0bf81e5bb5d06fe08c3ae31a494f165bae49f9
    command:
      - .venv/Scripts/python.exe
      - scripts/huatai_command_bridge.py
      - --config
      - configs/huatai_bridge_template.yaml
      - --simulate
    timeout_seconds: 30
    working_dir: ""
