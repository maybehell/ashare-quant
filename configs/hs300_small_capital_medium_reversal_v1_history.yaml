  top_n: 20
  max_stock_weight: 0.05
  max_industry_weight: 0.25
  weighting: equal
  benchmark_membership:
    enabled: true
    index_symbol: "000300"
    max_staleness_days: 120
  reference_anchor:
    enabled: false
  lookbacks:
    medium_reversal: 60
    medium_reversal_skip: 5
  required_factors:
    - medium_reversal
  weights:
    momentum: 0.00
    long_momentum: 0.00
    valuation: 0.00
    quality: 0.00
    low_volatility: 0.00
    low_downside_volatility: 0.00
    low_drawdown: 0.00
    trend_quality: 0.00
    short_reversal: 0.00
    residual_momentum: 0.00
    low_idiosyncratic_volatility: 0.00
    medium_reversal: 0.90
    liquidity: 0.10
  industry_neutralization:
    enabled: true
    min_group_size: 5
  cross_sectional_neutralization:
    enabled: false

risk_overlay:
  enabled: false

auto_live:
  enabled: false
  allow_broker_submit: false
  emergency_stop: true
