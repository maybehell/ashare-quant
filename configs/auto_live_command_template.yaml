# Command adapter must support account_snapshot, submit_orders, query_orders, cancel_orders before live.
# Example only. Keep all submit switches off until every auto-live gate and broker-side audit passes.
auto_live:
  enabled: false
  emergency_stop: false
  risk_limits:
    enabled: true
    max_orders_per_batch: 50
    max_single_order_amount: 100000
    max_batch_buy_amount: 500000
    max_batch_gross_amount: 1000000
    max_daily_buy_amount: 500000
    max_daily_gross_amount: 1000000
    min_cash_buffer_ratio: 0.02
    min_cash_buffer_amount: 10000
    allowed_sides: [buy, sell]
  broker_adapter: command
  allow_command_adapter: false
  allow_broker_submit: false
  require_adapter_replay_certification: true
  adapter_replay_dir: ""
  journal:
    enabled: true
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
  account_binding:
    required: true
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
  recovery:
    enabled: true
    required_before_submit: true
    retention_points: 30
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    required_files:
      - account_state_snapshot.csv
      - account_state_positions.csv
      - auto_live_broker_account_snapshot.csv
      - auto_live_broker_positions.csv
      - auto_live_broker_account_audit.csv
      - auto_live_account_binding.json
      - auto_live_event_journal.csv
      - auto_live_risk_audit.csv
    critical_files:
      - auto_live_journal_summary.csv
      - auto_live_adapter_replay_summary.csv
      - auto_live_adapter_file_audit.csv
  rollout:
    required_before_submit: true
    stage: canary
    approval_ttl_hours: 24
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    stages:
      canary:
        max_orders: 1
        max_single_order_amount: 20000
        max_buy_amount: 20000
        max_gross_amount: 20000
      limited:
        max_orders: 10
        max_single_order_amount: 50000
        max_buy_amount: 200000
        max_gross_amount: 200000
      full:
        max_orders: 50
        max_single_order_amount: 100000
        max_buy_amount: 500000
        max_gross_amount: 1000000
  alerting:
    enabled: true
    required_before_submit: true
    require_live_environment: true
    require_hmac: true
    hmac_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    selftest_max_age_seconds: 86400
    timeout_seconds: 15
    pinned_files:
      - path: scripts/alert_bridge_template.py
        sha256: c5d252ec40186a26cbe3ce408235ef14dc8cc80c882237e324c1f8c800f2ae8c
    command:
      - .venv/Scripts/python.exe
      - scripts/alert_bridge_template.py
      - --simulate
  service:
    enabled: false
    allow_submit: false
    interval_seconds: 60
    max_cycles: 0
    max_consecutive_failures: 3
    failure_backoff_seconds: 300
    lock_stale_seconds: 300
  allow_simulated_account_snapshot: false
  allow_outside_trading_window: false
  allow_stale_tickets: false
  max_ticket_age_days: 0
  account_snapshot_max_age_seconds: 300
  require_broker_clock_sync: true
  max_broker_clock_skew_seconds: 5
  submit_lock_stale_seconds: 900
  trading_window:
    timezone: Asia/Shanghai
    weekdays: [0, 1, 2, 3, 4]
    windows:
      - "09:25-11:30"
      - "13:00-14:57"
  command_adapter:
    require_hmac_integrity: true
    integrity_key_env: ASHARE_QUANT_ADAPTER_HMAC_KEY
    require_pinned_files: true
    pinned_files:
      - path: scripts/command_broker_bridge_template.py
        sha256: 794bfb3628ff46b4a07e0fbe7d5d4647f50f3d8f7485eb0b7f5e21e4f0149fc8
    command:
      - .venv/Scripts/python.exe
      - scripts/command_broker_bridge_template.py
      - --simulate-submit
    timeout_seconds: 30
    working_dir: ""
